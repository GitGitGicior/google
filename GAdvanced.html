<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
       
    </head>
    <body>
        <div id="links"><a href="index.html">Go Back</a></div>
        <div id="search">    
        <h1>GOOGLE ADVANCED SEARCH</h1>
        </div>
        <form id="advanced" action="https://www.google.com/search">      
            <section>
                <label>All the words:   <input type="text" name="q" placeholder="All the words"></label>  
                <label>Exact phrase:        <input type="text" name="epq" placeholder="Exact phrase"></label>
                <label>None of the words:       <input type="text" name="eq" placeholder="None of these words"></label>
                <label>Site to search:               <input type="text" name="sitesearch" placeholder="Site to search"></label>
            </section>

            <div class="submit-container"><input type="submit" value="Advanced Search"></div>
        </form>
        
        
    </body>
</html>
